name: Secure Per-File Approval System with Debug

on:
  schedule:
    - cron: '27 1 * * *'  # 08:27 น. เวลาไทย
    - cron: '59 5 * * *'  # 12:59 น. เวลาไทย
  workflow_dispatch:      # ปุ่มกดรันเอง Manual

jobs:
  # --- Job 1: ค้นหาไฟล์ใหม่และถ่ายรูปหน้าจอ ---
  scout:
    runs-on: ubuntu-latest
    outputs:
      new_files: ${{ steps.check.outputs.files }} # ส่งรายชื่อไฟล์ที่เจอไป Job ถัดไป
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          
      - id: check
        name: Run Scouting Mode
        env:
          APP_USER: ${{ secrets.PORTAL_USERNAME }}
          APP_PASS: ${{ secrets.PORTAL_PASSWORD }}
          APP_URL: ${{ secrets.TARGET_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
          ACTION_URL: "https://github.com/${{ github.repository }}/actions"
        run: python bot_script.py --mode check

      # --- ขั้นตอนสำคัญ: อัปโหลดรูปภาพ Screenshot เพื่อดูความจริง ---
      - name: Upload Screenshot for Debug
        if: always() # ให้รันเสมอไม่ว่าบอทจะเจอไฟล์หรือไม่
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_scout.png
          retention-days: 7 # เก็บรูปไว้ 7 วัน

  # --- Job 2: ด่านกักกันรายไฟล์ (Matrix Approval) ---
  dispatch-per-file:
    needs: scout
    # รันเฉพาะเมื่อ Job แรกเจอไฟล์ใหม่เท่านั้น
    if: needs.scout.outputs.new_files != '[]' && needs.scout.outputs.new_files != ''
    runs-on: ubuntu-latest
    environment: production # ด่านที่คุณพินต้องกด Approve
    strategy:
      matrix:
        filename: ${{ fromJson(needs.scout.outputs.new_files) }}
      max-parallel: 1 # ค่อยๆ ส่งทีละเมลเพื่อความปลอดภัย
    permissions:
      contents: write # สิทธิ์ในการบันทึก Log ลง GitHub
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          
      - name: Execute Mailing System
        env:
          APP_USER: ${{ secrets.PORTAL_USERNAME }}
          APP_PASS: ${{ secrets.PORTAL_PASSWORD }}
          APP_URL: ${{ secrets.TARGET_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          MAIL_USER: ${{ secrets.SENDER_EMAIL }}
          MAIL_PASS: ${{ secrets.SENDER_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.RECIPIENT_LIST }}
          MAIL_SIGNATURE: ${{ secrets.MAIL_SIGNATURE }}
        run: python bot_script.py --mode send --file "${{ matrix.filename }}"

      - name: Sync Encrypted Log
        run: |
          git config --global user.name "System-Auto-Bot"
          git config --global user.email "bot@github.com"
          git add log_history.txt || true
          git commit -m "Log: Sync Encrypted History [skip ci]" || true
          git push
