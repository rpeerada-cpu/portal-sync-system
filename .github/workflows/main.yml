name: Secure Per-File Approval System

on:
  schedule:
    - cron: '27 1 * * *'
    - cron: '59 5 * * *'
  workflow_dispatch:

jobs:
  # --- ด่านที่ 1: ค้นหาไฟล์ใหม่ ---
  scout:
    runs-on: ubuntu-latest
    outputs:
      new_files: ${{ steps.check.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.9' }
      - name: Setup Environment
        run: pip install playwright requests && playwright install chromium
      - id: check
        env:
          APP_USER: ${{ secrets.PORTAL_USERNAME }}
          APP_PASS: ${{ secrets.PORTAL_PASSWORD }}
          APP_URL: ${{ secrets.TARGET_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
          ACTION_URL: "https://github.com/${{ github.repository }}/actions"
        run: python bot_script.py --mode check

  # --- ด่านที่ 2: ด่านกักกันรายไฟล์ (Matrix) ---
  dispatch-per-file:
    needs: scout
    if: needs.scout.outputs.new_files != '[]' && needs.scout.outputs.new_files != ''
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        filename: ${{ fromJson(needs.scout.outputs.new_files) }}
      max-parallel: 1 
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.9' }
      - name: Setup Environment
        run: pip install playwright requests && playwright install chromium
      - name: Process Email
        env:
          APP_USER: ${{ secrets.PORTAL_USERNAME }}
          APP_PASS: ${{ secrets.PORTAL_PASSWORD }}
          APP_URL: ${{ secrets.TARGET_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          MAIL_USER: ${{ secrets.SENDER_EMAIL }}
          MAIL_PASS: ${{ secrets.SENDER_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.RECIPIENT_LIST }}
          MAIL_SIGNATURE: ${{ secrets.MAIL_SIGNATURE }}
        run: python bot_script.py --mode send --file "${{ matrix.filename }}"
      - name: Sync Log
        run: |
          git config --global user.name "System-Auto-Bot"
          git config --global user.email "bot@github.com"
          git add log_history.txt || true
          git commit -m "Log: Sync Encrypted Data [skip ci]" || true
          git push
