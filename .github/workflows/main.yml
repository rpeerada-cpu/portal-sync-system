name: Checklist Control System

on:
  schedule:
    - cron: '27 1 * * *'
    - cron: '59 5 * * *'
  issues:
    types: [labeled] # ทำงานเมื่อเราติดป้ายให้ใบงาน

jobs:
  # 1. ตรวจเจอแล้วสร้าง "ใบสั่งงาน" (Checklist)
  scout-and-create-issue:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.9' }
      - name: Setup
        run: pip install playwright requests && playwright install chromium
      - id: scout
        env:
          APP_USER: ${{ secrets.PORTAL_USERNAME }}
          APP_PASS: ${{ secrets.PORTAL_PASSWORD }}
          APP_URL: ${{ secrets.TARGET_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
        run: python bot_script.py --mode check
      
      - name: Create Issue Checklist
        if: steps.scout.outputs.file_list != '[]'
        uses: imjohnbo/issue-action@v3
        with:
          title: "📋 New Files Found: ${{ github.event.schedule || 'Manual' }}"
          body: |
            พบไฟล์ใหม่ในระบบ Isuzu ครับคุณพิน
            กรุณา "ติ๊กถูก" หน้าไฟล์ที่ต้องการส่งเมล แล้วติดป้าย **Approved** ให้ใบงานนี้ครับ
            
            ${{ steps.scout.outputs.file_list }}
          labels: "pending"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. ส่งเมลตามที่ติ๊ก (เมื่อติดป้าย Approved)
  send-ticked-files:
    if: github.event.label.name == 'Approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.9' }
      - name: Setup
        run: pip install playwright requests && playwright install chromium
      
      - name: Extract Ticked Files
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            const matches = body.match(/- \[x\] (.*)/g);
            if (!matches) return [];
            const files = matches.map(m => m.replace('- [x] ', '').trim());
            return files;

      - name: Dispatch Mailing
        if: steps.extract.outputs.result != '[]'
        env:
          APP_USER: ${{ secrets.PORTAL_USERNAME }}
          APP_PASS: ${{ secrets.PORTAL_PASSWORD }}
          APP_URL: ${{ secrets.TARGET_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          MAIL_USER: ${{ secrets.SENDER_EMAIL }}
          MAIL_PASS: ${{ secrets.SENDER_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.RECIPIENT_LIST }}
          MAIL_SIGNATURE: ${{ secrets.MAIL_SIGNATURE }}
        run: |
          python bot_script.py --mode send --files '${{ steps.extract.outputs.result }}'

      - name: Close Issue
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "ส่งเมลเรียบร้อยแล้วครับคุณพิน!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync Log
        run: |
          git config --global user.name "System-Bot"
          git config --global user.email "bot@github.com"
          git add log_history.txt || true
          git commit -m "Update history [skip ci]" || true
          git push
