name: Checklist Control System

on:
  schedule:
    - cron: '27 1 * * *'
    - cron: '59 5 * * *'
  workflow_dispatch:
  issues:
    types: [labeled] # ทำงานเมื่อคุณพินติดป้าย Approved ใน Issue

jobs:
  # --- ด่าน 1: ตรวจหาไฟล์แล้วสร้างใบสั่งงาน + แจ้งเตือนแชท ---
  scout-and-create-issue:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      file_list: ${{ steps.scout.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.9' }
      - name: Setup Environment
        run: pip install playwright requests && playwright install chromium
      - id: scout
        name: Run Scouting Mode
        env:
          APP_USER: ${{ secrets.PORTAL_USERNAME }}
          APP_PASS: ${{ secrets.PORTAL_PASSWORD }}
          APP_URL: ${{ secrets.TARGET_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
          ACTION_URL: "https://github.com/${{ github.repository }}/actions"
        run: python bot_script.py --mode check

      - name: Create Issue Checklist
        if: steps.scout.outputs.files != '[]' && steps.scout.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const files = JSON.parse('${{ steps.scout.outputs.files }}');
            let body = "### 📋 พบไฟล์ใหม่รอการอนุมัติ\n";
            body += "คุณพินกรุณา **ติ๊กถูก [x]** หน้าไฟล์ที่ต้องการส่งเมล แล้วติดป้าย **Approved** ด้านขวามือครับ\n\n";
            files.forEach(f => {
              body += `- [ ] ${f}\n`;
            });
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New Files Found: ${new Date().toLocaleDateString('th-TH')}`,
              body: body,
              labels: ['pending']
            });

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_scout.png

  # --- ด่าน 2: ส่งเมลตามไฟล์ที่เลือก (เมื่อติดป้าย Approved) ---
  send-ticked-files:
    if: github.event.label.name == 'Approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.9' }
      - name: Setup Environment
        run: pip install playwright requests && playwright install chromium
      
      - name: Extract Ticked Files
        id: extract
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const body = context.payload.issue.body;
            const lines = body.split('\n');
            const ticked = lines
              .filter(line => line.startsWith('- [x] '))
              .map(line => line.replace('- [x] ', '').trim());
            return JSON.stringify(ticked);

      - name: Process Mailing
        if: steps.extract.outputs.result != '[]'
        env:
          APP_USER: ${{ secrets.PORTAL_USERNAME }}
          APP_PASS: ${{ secrets.PORTAL_PASSWORD }}
          APP_URL: ${{ secrets.TARGET_URL }}
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
          MAIL_USER: ${{ secrets.SENDER_EMAIL }}
          MAIL_PASS: ${{ secrets.SENDER_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.RECIPIENT_LIST }}
          MAIL_SIGNATURE: ${{ secrets.MAIL_SIGNATURE }}
        run: |
          python bot_script.py --mode send --files '${{ steps.extract.outputs.result }}'

      - name: Close Issue
        if: always()
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "ดำเนินการส่งเมลสำเร็จแล้วครับ!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync Encrypted Log
        run: |
          git config --global user.name "System-Auto-Bot"
          git config --global user.email "bot@github.com"
          git add log_history.txt || true
          git commit -m "Update History [skip ci]" || true
          git push
